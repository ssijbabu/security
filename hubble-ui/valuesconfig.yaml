apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-ui-values
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: security-stack
data:
  values.yaml: |
    # ══════════════════════════════════════════════════════════════════════════════
    # IMAGES — update repository prefixes to match your private registry.
    # Two images must be mirrored: hubble-ui (frontend) and hubble-ui-backend.
    # ══════════════════════════════════════════════════════════════════════════════
    # ══════════════════════════════════════════════════════════════════════════════
    # CONFIGURATION
    # ══════════════════════════════════════════════════════════════════════════════

    # Disable Cilium agent and operator — already installed in the cluster.
    agent: false
    operator:
      enabled: false

    # Disable Envoy standalone DaemonSet — managed by the main Cilium release.
    envoy:
      enabled: false

    hubble:
      enabled: true

      # Relay is already installed — do not deploy a second instance.
      relay:
        enabled: false

      ui:
        enabled: true
        # standalone: connects to the existing Hubble Relay instead of
        # requiring relay to be part of this Helm release.
        standalone:
          enabled: true
        replicas: 1

        backend:
          image:
            repository: registry.example.com/cilium/hubble-ui-backend
            tag: "v0.13.5"
            useDigest: false
            pullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

        frontend:
          image:
            repository: registry.example.com/cilium/hubble-ui
            tag: "v0.13.5"
            useDigest: false
            pullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
