apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-ui-values
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: security-stack
data:
  values.yaml: |
    # ══════════════════════════════════════════════════════════════════════════════
    # IMAGES — update repository prefixes to match your private registry.
    # Three images must be mirrored: hubble-relay, hubble-ui-backend, hubble-ui.
    # ══════════════════════════════════════════════════════════════════════════════
    imagePullPolicy: IfNotPresent

    imagePullSecrets:
      - name: private-registry-credentials

    hubble:
      relay:
        image:
          repository: registry.example.com/cilium/hubble-relay
          tag: v1.19.5
          useDigest: false
          pullPolicy: IfNotPresent

      ui:
        backend:
          image:
            repository: registry.example.com/cilium/hubble-ui-backend
            tag: v0.13.5
            useDigest: false
            pullPolicy: IfNotPresent
        frontend:
          image:
            repository: registry.example.com/cilium/hubble-ui
            tag: v0.13.5
            useDigest: false
            pullPolicy: IfNotPresent

    # ══════════════════════════════════════════════════════════════════════════════
    # CONFIGURATION
    # ══════════════════════════════════════════════════════════════════════════════

    # Disable Cilium CNI agent and operator — this release installs only
    # Hubble components on top of an existing Cilium installation.
    agent: false
    operator:
      enabled: false

    hubble:
      enabled: true

      # ── Relay ──────────────────────────────────────────────────────────────────
      relay:
        enabled: true
        rollOutPods: true
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        # Relay runs as non-root — no kernel access required.
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        podSecurityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]

      # ── UI ─────────────────────────────────────────────────────────────────────
      ui:
        enabled: true
        rollOutPods: true
        replicas: 1
        # standalone: skip checking that Hubble relay is installed in the same
        # release — it is managed by the main Cilium HelmRelease.
        standalone:
          enabled: true

        backend:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Upstream default already sets allowPrivilegeEscalation: false.
          # Add runAsNonRoot and seccompProfile on top.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]

        frontend:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
