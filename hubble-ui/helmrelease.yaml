apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hubble-ui
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: security-stack
spec:
  # ── Chart source ─────────────────────────────────────────────────────────────
  # Reuses the cilium HelmRepository already present in flux-system.
  chart:
    spec:
      chart: cilium
      version: "1.19.5"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 12h

  interval: 1h
  releaseName: hubble-ui
  targetNamespace: kube-system
  storageNamespace: kube-system
  maxHistory: 5
  timeout: 5m

  install:
    createNamespace: false  # kube-system already exists
    crds: Skip              # Cilium CRDs managed by the main Cilium release
    remediation:
      retries: 3

  upgrade:
    crds: Skip
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true

  rollback:
    timeout: 5m
    cleanupOnFail: true

  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/status"]
        target:
          group: apps
          kind: Deployment

  # ── Values ───────────────────────────────────────────────────────────────────
  valuesFrom:
    - kind: ConfigMap
      name: hubble-ui-values
      valuesKey: values.yaml
