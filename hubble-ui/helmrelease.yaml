apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hubble-ui
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
    app.kubernetes.io/part-of: security-stack
spec:
  serviceAccountName: helm-controller
  # ── Chart source ─────────────────────────────────────────────────────────────
  # Reuses the cilium HelmRepository already present in flux-system.
  chart:
    spec:
      chart: cilium
      version: "1.19.5"
      sourceRef:
        kind: HelmRepository
        name: management-helm-repo
        namespace: flux-system
      interval: 12h

  interval: 1h
  releaseName: hubble-ui
  targetNamespace: kube-system
  storageNamespace: kube-system
  maxHistory: 5
  timeout: 5m

  install:
    createNamespace: false
    # Cilium CRDs are already present from the main Cilium release.
    crds: Skip
    remediation:
      retries: 3

  upgrade:
    crds: Skip
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true

  rollback:
    timeout: 5m
    cleanupOnFail: true

  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/status"]
        target:
          group: apps
          kind: Deployment

  # ── Values ───────────────────────────────────────────────────────────────────
  valuesFrom:
    - kind: ConfigMap
      name: hubble-ui-values
      valuesKey: values.yaml
