---
apiVersion: v1
kind: Namespace
metadata:
  name: logstash
  labels:
    app.kubernetes.io/part-of: security-stack

---
# ServiceAccount
# No Role or ClusterRole needed — Logstash is a Kafka consumer that writes to
# stdout and does not call the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logstash-sirt
  namespace: logstash
  labels:
    app.kubernetes.io/name: logstash-sirt
    app.kubernetes.io/part-of: security-stack
automountServiceAccountToken: false

---
# Logstash process settings
# http.host: 0.0.0.0 is required for the liveness/readiness probes to work.
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-sirt-config
  namespace: logstash
  labels:
    app.kubernetes.io/name: logstash-sirt
    app.kubernetes.io/part-of: security-stack
data:
  logstash.yml: |
    http.host: 0.0.0.0
    xpack.monitoring.enabled: false
    pipeline.ecs_compatibility: v8

---
# Pipeline — Kafka input → stdout
# Replace KAFKA_BOOTSTRAP_SERVERS and KAFKA_TOPIC via env vars or edit here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-sirt-pipeline
  namespace: logstash
  labels:
    app.kubernetes.io/name: logstash-sirt
    app.kubernetes.io/part-of: security-stack
data:
  logstash.conf: |
    input {
      kafka {
        bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS}"
        topics => ["${KAFKA_TOPIC}"]
        group_id => "logstash-sirt"
        codec => json
        consumer_threads => 1
      }
    }
    filter {
      # add filters here
    }
    output {
      stdout { codec => rubydebug }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash-sirt
  namespace: logstash
  labels:
    app.kubernetes.io/name: logstash-sirt
    app.kubernetes.io/version: "8.5.1"
    app.kubernetes.io/part-of: security-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logstash-sirt
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logstash-sirt
        app.kubernetes.io/version: "8.5.1"
    spec:
      serviceAccountName: logstash-sirt
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: logstash
          image: registry.example.com/logstash/logstash:8.5.1
          imagePullPolicy: IfNotPresent

          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC
              value: "your-topic"
            - name: LS_JAVA_OPTS
              value: "-Xmx512m -Xms512m"

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]

          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 768Mi

          ports:
            - name: http
              containerPort: 9600
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 300
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 3

          volumeMounts:
            - name: config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
              readOnly: true
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: logstash-sirt-config
        - name: pipeline
          configMap:
            name: logstash-sirt-pipeline
