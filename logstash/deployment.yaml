---
apiVersion: v1
kind: Namespace
metadata:
  name: xxxx
  labels:
    app.kubernetes.io/part-of: security-stack

---
# ServiceAccount
# No Role or ClusterRole needed — Logstash is a Kafka consumer that writes to
# stdout and does not call the Kubernetes API.
# The azure.workload.identity/client-id annotation binds this SA to the
# User-Assigned Managed Identity that has Event Hubs Data Receiver on the
# Event Hub namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logstash-yyyy
  namespace: xxxx
  labels:
    app.kubernetes.io/name: logstash-yyyy
    app.kubernetes.io/part-of: security-stack
  annotations:
    azure.workload.identity/client-id: "<managed-identity-client-id>"
automountServiceAccountToken: false

---
# Logstash process settings
# http.host: 0.0.0.0 is required for the liveness/readiness probes to work.
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-yyyy-config
  namespace: xxxx
  labels:
    app.kubernetes.io/name: logstash-yyyy
    app.kubernetes.io/part-of: security-stack
data:
  logstash.yml: |
    http.host: 0.0.0.0
    xpack.monitoring.enabled: false
    pipeline.ecs_compatibility: v8
  jvm.options: |
    -Xms512m
    -Xmx512m
    -XX:+UseG1GC
    -XX:G1ReservePercent=25
    -XX:InitiatingHeapOccupancyPercent=30
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/usr/share/logstash/data
    -Djava.awt.headless=true
    -Dfile.encoding=UTF-8
    -Djava.security.egd=file:/dev/urandom

---
# Pipeline — Azure Event Hubs (Kafka endpoint) → Elasticsearch via Workload Identity
# bootstrap_servers: <namespace>.servicebus.windows.net:9093
# The OAuthBearer callback handler exchanges the OIDC token (injected at
# $AZURE_FEDERATED_TOKEN_FILE by the workload identity webhook) for an
# Azure AD access token scoped to Event Hubs.
# Requires the azure-eventhubs-kafka JAR in the Logstash classpath — add it to
# /usr/share/logstash/vendor/jar/kafka/ in your custom image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-yyyy-pipeline
  namespace: xxxx
  labels:
    app.kubernetes.io/name: logstash-yyyy
    app.kubernetes.io/part-of: security-stack
data:
  logstash.conf: |
    input {
      kafka {
        bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS}"
        topics => ["${KAFKA_TOPIC}"]
        group_id => "logstash-yyyy"
        codec => json
        consumer_threads => 1
        security_protocol => "SASL_SSL"
        sasl_mechanism => "OAUTHBEARER"
        sasl_jaas_config => "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;"
        sasl_login_callback_handler_class => "com.microsoft.azure.eventhubs.kafka.oauth.AzureEventHubsCallbackHandler"
      }
    }
    filter {
      # add filters here
    }
    output {
      elasticsearch {
        # List all StatefulSet pods via the headless service so Logstash
        # round-robins at the request level. The ClusterIP service only
        # load-balances per TCP connection, so persistent connections would
        # pin all writes to a single node.
        hosts => [
          "http://sirt-master-0.sirt-master-headless.kube-system.svc.cluster.local:9200",
          "http://sirt-master-1.sirt-master-headless.kube-system.svc.cluster.local:9200",
          "http://sirt-master-2.sirt-master-headless.kube-system.svc.cluster.local:9200"
        ]
        index => "sirt-events-%{+YYYY.MM.dd}"
        action => "index"
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash-yyyy
  namespace: xxxx
  labels:
    app.kubernetes.io/name: logstash-yyyy
    app.kubernetes.io/version: "8.5.1"
    app.kubernetes.io/part-of: security-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logstash-yyyy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logstash-yyyy
        app.kubernetes.io/version: "8.5.1"
        # Required: triggers the Azure Workload Identity webhook to inject the
        # OIDC projected token and the AZURE_* env vars into this pod.
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: logstash-yyyy
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: logstash
          image: registry.example.com/logstash/logstash:8.5.1
          imagePullPolicy: IfNotPresent

          env:
            # Azure Event Hubs Kafka endpoint — port 9093, not 9092.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "<eventhub-namespace>.servicebus.windows.net:9093"
            - name: KAFKA_TOPIC
              value: "<eventhub-name>"
            # JVM heap and GC settings are in jvm.options (mounted below).
            # Injected automatically by the workload identity webhook when
            # azure.workload.identity/use: "true" is set on the pod.
            # Listed here for visibility; do not set values manually.
            # AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_FEDERATED_TOKEN_FILE,
            # AZURE_AUTHORITY_HOST

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]

          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 768Mi

          ports:
            - name: http
              containerPort: 9600
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 300
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 3

          volumeMounts:
            - name: config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
              readOnly: true
            - name: config
              mountPath: /usr/share/logstash/config/jvm.options
              subPath: jvm.options
              readOnly: true
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: logstash-yyyy-config
        - name: pipeline
          configMap:
            name: logstash-yyyy-pipeline
