apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-values
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: security-stack
data:
  values.yaml: |
    # ══════════════════════════════════════════════════════════════════════════════
    # IMAGES
    # ══════════════════════════════════════════════════════════════════════════════
    image: "registry.example.com/kibana/kibana"
    imageTag: "8.5.1"
    imagePullPolicy: IfNotPresent

    # ══════════════════════════════════════════════════════════════════════════════
    # CONFIGURATION
    # ══════════════════════════════════════════════════════════════════════════════
    replicas: 1

    # Chart defaults point these at Secrets generated by the Elasticsearch
    # chart's secret.enabled feature. We set secret.enabled: false on ES so
    # those Secrets don't exist — Kibana will fail to mount them unless cleared.
    elasticsearchCredentialSecret: ""
    elasticsearchCertificateSecret: ""
    elasticsearchCertificateAuthoritiesFile: ""

    # Plain HTTP to match protocol: http on the Elasticsearch release.
    protocol: http

    # Service name is {clusterName}-{nodeGroup} = sirt-master.
    elasticsearchHosts: "http://sirt-master:9200"

    kibanaConfig:
      kibana.yml: |
        server.name: kibana-sirt
        xpack.security.enabled: false

    extraEnvs:
      # Chart default is 1800 but our memory limit is 1Gi. Keep Node.js heap
      # below ~75% of the container limit to avoid OOMKilled.
      - name: NODE_OPTIONS
        value: "--max-old-space-size=900"
      - name: xpack.security.enabled
        value: "false"

    # Kibana only talks to Elasticsearch — it does not call the Kubernetes API.
    automountToken: false

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop: [ALL]
      allowPrivilegeEscalation: false

    service:
      type: ClusterIP
      port: 5601
