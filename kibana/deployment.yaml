---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kibana
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: security-stack
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: security-stack
data:
  kibana.yml: |
    server.host: "0.0.0.0"
    server.name: "kibana-sirt"
    elasticsearch.hosts: ["http://sirt-master.kube-system.svc.cluster.local:9200"]
    monitoring.kibana.collection.enabled: false

---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: security-stack
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5601
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: kibana

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/version: "8.5.1"
    app.kubernetes.io/part-of: security-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
        app.kubernetes.io/version: "8.5.1"
    spec:
      serviceAccountName: kibana
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: kibana
          image: registry.example.com/kibana/kibana:8.5.1
          imagePullPolicy: IfNotPresent

          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=900"

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]

          ports:
            - name: http
              containerPort: 5601
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /app/kibana
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /app/kibana
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            - name: config
              mountPath: /usr/share/kibana/config/kibana.yml
              subPath: kibana.yml
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: kibana-config
