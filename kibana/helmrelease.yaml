apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kibana
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
    app.kubernetes.io/part-of: security-stack
spec:
  serviceAccountName: helm-controller
  chart:
    spec:
      chart: kibana
      version: "8.5.1"
      sourceRef:
        kind: HelmRepository
        name: management-helm-repo
        namespace: flux-system
      interval: 15m

  interval: 15m
  releaseName: kibana
  # Deploy into the same namespace as Elasticsearch so the short service
  # name "sirt-master" resolves without a FQDN.
  targetNamespace: elastic
  storageNamespace: elastic
  maxHistory: 5
  timeout: 10m

  install:
    createNamespace: false
    crds: Skip
    remediation:
      retries: 3

  upgrade:
    crds: Skip
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true

  rollback:
    timeout: 5m
    cleanupOnFail: true
    recreate: false

  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/status"]
        target:
          group: apps
          kind: Deployment

  valuesFrom:
    - kind: ConfigMap
      name: kibana-values
      valuesKey: values.yaml
