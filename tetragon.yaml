################################################################################
# Tetragon — Production DaemonSet manifest
#
# Requirements enforced:
#   - runAsUser: 65534 (nobody) on every container; runAsNonRoot: true
#   - capabilities granted explicitly; privileged: false
#   - seccompProfile: RuntimeDefault on pod + container
#   - readOnlyRootFilesystem: true on all containers
#
# Deploy order: apply this file, then wait for DaemonSet rollout:
#   kubectl apply -f tetragon.yaml
#   kubectl rollout status daemonset/tetragon -n tetragon
#
# Image pinning: replace the tag-based image refs below with
#   quay.io/cilium/tetragon@sha256:<digest>
# before shipping to production. Obtain the digest with:
#   crane digest quay.io/cilium/tetragon:v1.4.0
################################################################################

---
# ── Namespace ──────────────────────────────────────────────────────────────────
# PSA must be 'privileged': hostPID and Linux capabilities BPF/PERFMON/SYS_PTRACE
# are blocked by 'baseline' and 'restricted'. Non-root is enforced at the
# container securityContext level instead.
apiVersion: v1
kind: Namespace
metadata:
  name: tetragon
  labels:
    app.kubernetes.io/name: tetragon
    app.kubernetes.io/component: security-observability
    app.kubernetes.io/part-of: security-stack
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest

---
# ── ResourceQuota ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tetragon
  namespace: tetragon
  labels:
    app.kubernetes.io/name: tetragon
    app.kubernetes.io/component: quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "110"
    services: "5"
    configmaps: "10"
    persistentvolumeclaims: "0"

---
# ── LimitRange ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: LimitRange
metadata:
  name: tetragon
  namespace: tetragon
  labels:
    app.kubernetes.io/name: tetragon
    app.kubernetes.io/component: limitrange
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 50m
        memory: 64Mi

---
# ── ServiceAccount ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tetragon
  namespace: tetragon
  labels:
    app.kubernetes.io/name: tetragon
    app.kubernetes.io/component: serviceaccount
  annotations:
    # Disable auto-mounting; the DaemonSet opts in explicitly.
    kubernetes.io/enforce-mountable-secrets: "true"
automountServiceAccountToken: false

---
# ── ClusterRole ────────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tetragon
  labels:
    app.kubernetes.io/name: tetragon
    app.kubernetes.io/component: rbac
rules:
  # Core API — read-only pod/node/namespace metadata for event enrichment
  - apiGroups: [""]
    resources: [pods, services, nodes, namespaces]
    verbs: [get, list, watch]
  # Tetragon tracing policy CRDs
  - apiGroups: [cilium.io]
    resources:
      - tracingpolicies
      - tracingpoliciesnamespaced
      - podinfo
    verbs: [get, list, watch]
  # Allow the agent to read its own token for API server auth
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    verbs: [create]

---
# ── ClusterRoleBinding ─────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tetragon
  labels:
    app.kubernetes.io/name: tetragon
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tetragon
subjects:
  - kind: ServiceAccount
    name: tetragon
    namespace: tetragon

---
# ── ConfigMap ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: tetragon-config
  namespace: tetragon
  labels:
    app.kubernetes.io/name: tetragon
    app.kubernetes.io/component: config
data:
  export-filename: /var/run/cilium/tetragon/tetragon.log
  # Rotate log files so the hostPath volume doesn't fill the node disk.
  export-file-max-size-mb: "100"
  export-file-rotation-interval: "24h"
  export-file-compress: "true"
  enable-process-cred: "true"
  enable-process-ns: "true"
  # Keep Tetragon metrics on a fixed port for ServiceMonitor scraping.
  metrics-server: ":2112"
  # gRPC address for the tetra CLI and relay consumers.
  server-address: "localhost:54321"
  log-level: "info"
  log-format: "json"

---
# ── DaemonSet ──────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tetragon
  namespace: tetragon
  labels:
    app.kubernetes.io/name: tetragon
    app.kubernetes.io/component: agent
    app.kubernetes.io/version: "1.4.0"
    app.kubernetes.io/part-of: security-stack
  annotations:
    # Trigger a rollout when the ConfigMap changes (when used with Reloader or
    # similar; this annotation documents the dependency).
    checksum/config: "managed-by-ci-pipeline"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tetragon
      app.kubernetes.io/component: agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # Replace one node at a time to avoid coverage gaps during upgrades.
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tetragon
        app.kubernetes.io/component: agent
        app.kubernetes.io/version: "1.4.0"
      annotations:
        # Prometheus scraping — also covered by ServiceMonitor below.
        prometheus.io/scrape: "true"
        prometheus.io/port: "2112"
        prometheus.io/path: "/metrics"
    spec:
      # ── Identity ─────────────────────────────────────────────────────────────
      serviceAccountName: tetragon
      automountServiceAccountToken: false

      # ── Scheduling ───────────────────────────────────────────────────────────
      # system-node-critical ensures the security daemon is evicted last.
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/memory-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/pid-pressure
          operator: Exists
          effect: NoSchedule
      # Only schedule on Linux nodes.
      nodeSelector:
        kubernetes.io/os: linux

      # ── Networking ───────────────────────────────────────────────────────────
      hostPID: true
      hostNetwork: false
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "3"
          - name: timeout
            value: "2"
          - name: attempts
            value: "3"

      # ── Pod-level security context ────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          # RuntimeDefault blocks bpf(2) on some container runtimes (<= Docker 20).
          # Verify on your runtime; fall back to Unconfined if bpf() is blocked.
          type: RuntimeDefault

      # ── Termination ──────────────────────────────────────────────────────────
      terminationGracePeriodSeconds: 60

      # ── Init containers ──────────────────────────────────────────────────────
      initContainers:
        - name: mount-bpf-fs
          image: quay.io/cilium/tetragon:v1.4.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              mountpoint -q /sys/fs/bpf || mount -t bpf bpf /sys/fs/bpf -o rw,nosuid,nodev,noexec,relatime
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
              add:
                - SYS_ADMIN   # required for mount(2) of bpffs
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: bpf-maps
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional

      # ── Containers ───────────────────────────────────────────────────────────
      containers:
        - name: tetragon
          image: quay.io/cilium/tetragon:v1.4.0
          imagePullPolicy: IfNotPresent
          args:
            - --config-dir=/etc/tetragon/tetragon.conf.d/
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          # ── Ports ────────────────────────────────────────────────────────────
          ports:
            - name: metrics
              containerPort: 2112
              protocol: TCP
            - name: grpc
              containerPort: 54321
              protocol: TCP

          # ── Security context ─────────────────────────────────────────────────
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
              add:
                - BPF         # load/pin/manage eBPF programs and maps
                - PERFMON     # attach perf_event sources used by eBPF
                - SYS_RESOURCE  # raise RLIMIT_MEMLOCK for BPF map memory
                - NET_ADMIN   # attach TC/XDP eBPF programs
                - SYS_PTRACE  # read /proc/<pid>/status for credential enrichment

          # ── Probes ───────────────────────────────────────────────────────────
          startupProbe:
            httpGet:
              path: /healthz
              port: 6789
            # Allow up to 3 min for eBPF program loading on first start.
            failureThreshold: 18
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6789
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6789
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3

          # ── Lifecycle ────────────────────────────────────────────────────────
          lifecycle:
            preStop:
              exec:
                # Drain in-flight events before the container is stopped.
                command: ["/bin/bash", "-c", "sleep 5"]

          # ── Resources ────────────────────────────────────────────────────────
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi

          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: FallbackToLogsOnError

          # ── Volume mounts ────────────────────────────────────────────────────
          volumeMounts:
            - name: bpf-maps
              mountPath: /sys/fs/bpf
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: false
            - name: tetragon-run
              mountPath: /var/run/cilium/tetragon
            - name: tetragon-config
              mountPath: /etc/tetragon/tetragon.conf.d/
              readOnly: true
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: tmp
              mountPath: /tmp

      # ── Volumes ──────────────────────────────────────────────────────────────
      volumes:
        - name: bpf-maps
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: DirectoryOrCreate
        - name: tetragon-run
          hostPath:
            path: /var/run/cilium/tetragon
            type: DirectoryOrCreate
        - name: tetragon-config
          configMap:
            name: tetragon-config
        - name: proc
          hostPath:
            path: /proc
        - name: tmp
          emptyDir: {}

---
# ── Service ────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: tetragon
  namespace: tetragon
  labels:
    app.kubernetes.io/name: tetragon
    app.kubernetes.io/component: service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "2112"
spec:
  selector:
    app.kubernetes.io/name: tetragon
    app.kubernetes.io/component: agent
  ports:
    - name: metrics
      port: 2112
      targetPort: metrics
      protocol: TCP
    - name: grpc
      port: 54321
      targetPort: grpc
      protocol: TCP
  type: ClusterIP
  clusterIP: None  # Headless — each pod is addressed individually by Prometheus

---
# ── ServiceMonitor (Prometheus Operator) ──────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tetragon
  namespace: tetragon
  labels:
    app.kubernetes.io/name: tetragon
    app.kubernetes.io/component: monitoring
    # Match this label in your Prometheus CR's serviceMonitorSelector.
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tetragon
      app.kubernetes.io/component: service
  namespaceSelector:
    matchNames: [tetragon]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace

---
# ── PrometheusRule (alerting) ──────────────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tetragon
  namespace: tetragon
  labels:
    app.kubernetes.io/name: tetragon
    app.kubernetes.io/component: alerting
    release: prometheus
spec:
  groups:
    - name: tetragon.health
      interval: 60s
      rules:
        - alert: TetragonAgentDown
          expr: |
            absent(up{job="tetragon"} == 1)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Tetragon agent unreachable"
            description: "Tetragon metrics endpoint has been unreachable for > 2 minutes on {{ $labels.node }}."

        - alert: TetragonDaemonSetNotFullyScheduled
          expr: |
            kube_daemonset_status_desired_number_scheduled{daemonset="tetragon",namespace="tetragon"}
              !=
            kube_daemonset_status_current_number_scheduled{daemonset="tetragon",namespace="tetragon"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Tetragon DaemonSet not fully scheduled"
            description: "{{ $value }} nodes are missing a Tetragon pod."

        - alert: TetragonHighDropRate
          expr: |
            rate(tetragon_events_exported_total{result="dropped"}[5m]) > 100
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Tetragon event drop rate elevated"
            description: "Tetragon is dropping > 100 events/sec on {{ $labels.node }}. Consider increasing buffer size."

---
# ── PodDisruptionBudget ────────────────────────────────────────────────────────
# Supported for DaemonSets on Kubernetes >= 1.27 (beta).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tetragon
  namespace: tetragon
  labels:
    app.kubernetes.io/name: tetragon
    app.kubernetes.io/component: pdb
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tetragon
      app.kubernetes.io/component: agent
  # Allow at most one pod to be unavailable per drain cycle.
  maxUnavailable: 1

---
# ── NetworkPolicy ──────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tetragon
  namespace: tetragon
  labels:
    app.kubernetes.io/name: tetragon
    app.kubernetes.io/component: netpol
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tetragon
      app.kubernetes.io/component: agent
  policyTypes: [Ingress, Egress]
  ingress:
    # Prometheus scraping on metrics port
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 2112
          protocol: TCP
    # tetra CLI and relay consumers via gRPC
    - from:
        - namespaceSelector: {}
      ports:
        - port: 54321
          protocol: TCP
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Kubernetes API server (HTTPS)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # Allow API server on its standard in-cluster endpoint
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32  # block cloud metadata endpoints
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
