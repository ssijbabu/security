################################################################################
# KubeArmor — Production DaemonSet manifest
#
# Requirements enforced:
#   - runAsUser: 65534 (nobody) on every container; runAsNonRoot: true
#   - capabilities granted explicitly; privileged: false
#   - seccompProfile: RuntimeDefault on pod + container
#   - readOnlyRootFilesystem: true on all containers
#
# Deploy order:
#   kubectl apply -f kubearmor.yaml
#   kubectl rollout status daemonset/kubearmor -n kubearmor
#
# Prerequisites:
#   - KubeArmor CRDs installed: kubectl apply -f \
#       https://raw.githubusercontent.com/kubearmor/KubeArmor/main/deployments/CRD/
#   - Prometheus Operator installed (for ServiceMonitor / PrometheusRule)
#
# Image pinning: replace the tag-based image refs below with
#   kubearmor/kubearmor@sha256:<digest>
# before shipping to production. Obtain the digest with:
#   crane digest kubearmor/kubearmor:v1.4.0
################################################################################

---
# ── Namespace ──────────────────────────────────────────────────────────────────
# PSA must be 'privileged': hostPID, MAC_ADMIN (AppArmor), BPF, and SYS_PTRACE
# are all blocked by 'baseline' and 'restricted' policies. Non-root is enforced
# at the container securityContext level instead.
apiVersion: v1
kind: Namespace
metadata:
  name: kubearmor
  labels:
    app.kubernetes.io/name: kubearmor
    app.kubernetes.io/component: runtime-security
    app.kubernetes.io/part-of: security-stack
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest

---
# ── ResourceQuota ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: ResourceQuota
metadata:
  name: kubearmor
  namespace: kubearmor
  labels:
    app.kubernetes.io/name: kubearmor
    app.kubernetes.io/component: quota
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 8Gi
    limits.cpu: "16"
    limits.memory: 16Gi
    pods: "110"
    services: "5"
    configmaps: "10"
    persistentvolumeclaims: "0"

---
# ── LimitRange ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: LimitRange
metadata:
  name: kubearmor
  namespace: kubearmor
  labels:
    app.kubernetes.io/name: kubearmor
    app.kubernetes.io/component: limitrange
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 512Mi
      defaultRequest:
        cpu: 200m
        memory: 256Mi
      max:
        cpu: "4"
        memory: 4Gi
      min:
        cpu: 50m
        memory: 64Mi

---
# ── ServiceAccount ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubearmor
  namespace: kubearmor
  labels:
    app.kubernetes.io/name: kubearmor
    app.kubernetes.io/component: serviceaccount
  annotations:
    kubernetes.io/enforce-mountable-secrets: "true"
automountServiceAccountToken: false

---
# ── ClusterRole ────────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubearmor
  labels:
    app.kubernetes.io/name: kubearmor
    app.kubernetes.io/component: rbac
rules:
  # Read-only access for workload metadata enrichment
  - apiGroups: [""]
    resources: [nodes, pods, namespaces, serviceaccounts, endpoints, services]
    verbs: [get, list, watch]
  # Write pod annotations to advertise enforced policies
  - apiGroups: [""]
    resources: [pods]
    verbs: [patch, update]
  # KubeArmor policy CRDs
  - apiGroups: [security.kubearmor.com]
    resources:
      - kubearmorpolicies
      - kubearmorhostpolicies
      - kubearmorclusterpolicies
    verbs: [get, list, watch]
  # Watch higher-level workload owners for policy targeting
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  # Allow the agent to create its own token for API server auth
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    verbs: [create]
  # Required for node-level security event reporting
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]

---
# ── ClusterRoleBinding ─────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubearmor
  labels:
    app.kubernetes.io/name: kubearmor
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubearmor
subjects:
  - kind: ServiceAccount
    name: kubearmor
    namespace: kubearmor

---
# ── ConfigMap ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubearmor-config
  namespace: kubearmor
  labels:
    app.kubernetes.io/name: kubearmor
    app.kubernetes.io/component: config
data:
  config.yaml: |
    # Default posture for workloads that do not have an explicit policy.
    # 'audit'  — log violations without blocking (safe for rollout phase)
    # 'block'  — enforce and block violations (production target)
    defaultFilePosture: audit
    defaultNetworkPosture: audit
    defaultCapabilitiesPosture: audit

    # Alert throttling prevents log floods during an incident.
    alertThrottling: true
    maxAlertPerSec: 20
    throttleSec: 30

    # gRPC server address
    gRPC: ":32767"

    # Log output
    logPath: /tmp/kubearmor.log

    # Enable all policy types
    enableKubeArmorPolicy: true
    enableKubeArmorHostPolicy: true

    # JSON structured logging for log aggregation pipelines
    logFormat: json

---
# ── DaemonSet ──────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubearmor
  namespace: kubearmor
  labels:
    app.kubernetes.io/name: kubearmor
    app.kubernetes.io/component: agent
    app.kubernetes.io/version: "1.4.0"
    app.kubernetes.io/part-of: security-stack
  annotations:
    checksum/config: "managed-by-ci-pipeline"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubearmor
      app.kubernetes.io/component: agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubearmor
        app.kubernetes.io/component: agent
        app.kubernetes.io/version: "1.4.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        # AppArmor: unconfined is required for KubeArmor to load and manage
        # AppArmor profiles at runtime. This annotation applies to k8s < 1.30;
        # for k8s >= 1.30 the appArmorProfile field in securityContext is used.
        container.apparmor.security.beta.kubernetes.io/kubearmor: unconfined
    spec:
      # ── Identity ─────────────────────────────────────────────────────────────
      serviceAccountName: kubearmor
      automountServiceAccountToken: false

      # ── Scheduling ───────────────────────────────────────────────────────────
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/memory-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/pid-pressure
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/os: linux

      # ── Networking ───────────────────────────────────────────────────────────
      hostPID: true
      hostNetwork: false
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "3"
          - name: timeout
            value: "2"
          - name: attempts
            value: "3"

      # ── Pod-level security context ────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          # RuntimeDefault may block bpf(2) on older Docker runtimes (<= 20).
          # Verify on your runtime; fall back to Unconfined if bpf() is blocked.
          type: RuntimeDefault

      # ── Termination ──────────────────────────────────────────────────────────
      terminationGracePeriodSeconds: 60

      # ── Init containers ──────────────────────────────────────────────────────
      initContainers:
        # 1. Ensure BPF filesystem is mounted before KubeArmor starts.
        - name: mount-bpf-fs
          image: kubearmor/kubearmor-init:v1.4.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              mountpoint -q /sys/fs/bpf || mount -t bpf bpf /sys/fs/bpf -o rw,nosuid,nodev,noexec,relatime
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
              add:
                - SYS_ADMIN   # required for mount(2) of bpffs
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: bpf-maps
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional

      # ── Containers ───────────────────────────────────────────────────────────
      containers:
        - name: kubearmor
          image: kubearmor/kubearmor:v1.4.0
          imagePullPolicy: IfNotPresent
          args:
            - -config=/etc/kubearmor/config.yaml
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBEARMOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          # ── Ports ────────────────────────────────────────────────────────────
          ports:
            - name: grpc
              containerPort: 32767
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP

          # ── Security context ─────────────────────────────────────────────────
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            # k8s >= 1.30: use this instead of the pod annotation above.
            appArmorProfile:
              type: Unconfined
            capabilities:
              drop: [ALL]
              add:
                - BPF           # load/pin/manage eBPF programs and maps
                - PERFMON       # attach perf_event sources used by eBPF
                - SYS_RESOURCE  # raise RLIMIT_MEMLOCK for BPF map memory
                - NET_ADMIN     # attach TC/XDP eBPF programs
                - SYS_PTRACE    # read /proc/<pid>/status for process inspection
                - MAC_ADMIN     # load and manage AppArmor profiles at runtime
                - IPC_LOCK      # mlock() BPF map memory pages

          # ── Probes ───────────────────────────────────────────────────────────
          startupProbe:
            exec:
              command: ["/bin/grpc_health_probe", "-addr=:32767"]
            # Allow up to 3 min for eBPF loading + AppArmor profile compilation.
            failureThreshold: 18
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/grpc_health_probe", "-addr=:32767"]
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3

          # ── Lifecycle ────────────────────────────────────────────────────────
          lifecycle:
            preStop:
              exec:
                # Allow in-flight gRPC streams to drain before SIGTERM.
                command: ["/bin/sh", "-c", "sleep 5"]

          # ── Resources ────────────────────────────────────────────────────────
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: FallbackToLogsOnError

          # ── Volume mounts ────────────────────────────────────────────────────
          volumeMounts:
            - name: bpf-maps
              mountPath: /sys/fs/bpf
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: containerd-sock
              mountPath: /var/run/containerd/containerd.sock
              readOnly: true
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: true
            - name: crio-sock
              mountPath: /var/run/crio/crio.sock
              readOnly: true
            - name: kubearmor-config
              mountPath: /etc/kubearmor
              readOnly: true
            - name: tmp
              mountPath: /tmp

      # ── Volumes ──────────────────────────────────────────────────────────────
      volumes:
        - name: bpf-maps
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: DirectoryOrCreate
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: containerd-sock
          hostPath:
            path: /var/run/containerd/containerd.sock
            type: Socket
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            # FileOrCreate because Docker may not be present on all nodes
            type: FileOrCreate
        - name: crio-sock
          hostPath:
            path: /var/run/crio/crio.sock
            type: FileOrCreate
        - name: kubearmor-config
          configMap:
            name: kubearmor-config
        - name: tmp
          emptyDir: {}

---
# ── Service ────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: kubearmor
  namespace: kubearmor
  labels:
    app.kubernetes.io/name: kubearmor
    app.kubernetes.io/component: service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  selector:
    app.kubernetes.io/name: kubearmor
    app.kubernetes.io/component: agent
  ports:
    - name: grpc
      port: 32767
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
  type: ClusterIP
  clusterIP: None  # Headless — each pod is addressed individually by Prometheus

---
# ── ServiceMonitor (Prometheus Operator) ──────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubearmor
  namespace: kubearmor
  labels:
    app.kubernetes.io/name: kubearmor
    app.kubernetes.io/component: monitoring
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubearmor
      app.kubernetes.io/component: service
  namespaceSelector:
    matchNames: [kubearmor]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace

---
# ── PrometheusRule (alerting) ──────────────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubearmor
  namespace: kubearmor
  labels:
    app.kubernetes.io/name: kubearmor
    app.kubernetes.io/component: alerting
    release: prometheus
spec:
  groups:
    - name: kubearmor.health
      interval: 60s
      rules:
        - alert: KubeArmorAgentDown
          expr: |
            absent(up{job="kubearmor"} == 1)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "KubeArmor agent unreachable"
            description: "KubeArmor metrics endpoint has been unreachable for > 2 minutes on {{ $labels.node }}."

        - alert: KubeArmorDaemonSetNotFullyScheduled
          expr: |
            kube_daemonset_status_desired_number_scheduled{daemonset="kubearmor",namespace="kubearmor"}
              !=
            kube_daemonset_status_current_number_scheduled{daemonset="kubearmor",namespace="kubearmor"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "KubeArmor DaemonSet not fully scheduled"
            description: "{{ $value }} nodes are missing a KubeArmor pod."

        - alert: KubeArmorPolicyViolationsSpike
          expr: |
            rate(kubearmor_policy_violations_total[5m]) > 50
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "KubeArmor policy violations spike"
            description: "KubeArmor is recording > 50 policy violations/sec on {{ $labels.node }}. Investigate workload behaviour."

        - alert: KubeArmorBlockedProcessesSpike
          expr: |
            rate(kubearmor_policy_violations_total{action="Block"}[5m]) > 10
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "KubeArmor block rate elevated"
            description: "KubeArmor is blocking > 10 processes/sec on {{ $labels.node }}. Possible attack or misconfigured policy."

---
# ── PodDisruptionBudget ────────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kubearmor
  namespace: kubearmor
  labels:
    app.kubernetes.io/name: kubearmor
    app.kubernetes.io/component: pdb
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubearmor
      app.kubernetes.io/component: agent
  maxUnavailable: 1

---
# ── NetworkPolicy ──────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubearmor
  namespace: kubearmor
  labels:
    app.kubernetes.io/name: kubearmor
    app.kubernetes.io/component: netpol
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubearmor
      app.kubernetes.io/component: agent
  policyTypes: [Ingress, Egress]
  ingress:
    # Prometheus scraping on metrics port
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
    # KubeArmor relay and CLI consumers via gRPC
    - from:
        - namespaceSelector: {}
      ports:
        - port: 32767
          protocol: TCP
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Kubernetes API server
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32  # block cloud metadata endpoints
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
