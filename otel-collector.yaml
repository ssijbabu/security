################################################################################
# OpenTelemetry Collector — Production DaemonSet (agent mode)
#
# Role: runs on every node, receives OTLP from local workloads, enriches
#       signals with k8s metadata, and forwards to the OTel Gateway.
#
# Non-root enforcement:
#   - runAsUser: 65534 (nobody); runAsNonRoot: true
#   - capabilities.drop: [ALL] — no adds required (no eBPF or kernel access)
#   - readOnlyRootFilesystem: true
#
# Prerequisites:
#   - Prometheus Operator installed (for ServiceMonitor / PrometheusRule)
#
# Image pinning: replace the tag with a digest before shipping:
#   crane digest otel/opentelemetry-collector-contrib:0.115.0
################################################################################

---
# ── Namespace ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: opentelemetry
    # OTel collector needs no host-level privileges — enforce restricted PSA.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest

---
# ── ResourceQuota ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: ResourceQuota
metadata:
  name: otel-collector
  namespace: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "110"
    services: "5"
    configmaps: "10"
    persistentvolumeclaims: "0"

---
# ── LimitRange ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: LimitRange
metadata:
  name: otel-collector
  namespace: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: limitrange
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 50m
        memory: 64Mi

---
# ── ServiceAccount ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: serviceaccount
  annotations:
    kubernetes.io/enforce-mountable-secrets: "true"
automountServiceAccountToken: false

---
# ── ClusterRole ────────────────────────────────────────────────────────────────
# The k8sattributes processor and kubeletstats receiver require cluster-scoped
# read access to enrich telemetry signals with Kubernetes metadata.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: rbac
rules:
  # k8sattributes processor — workload metadata enrichment
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      - nodes
      - services
      - endpoints
      - replicationcontrollers
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  # kubeletstats receiver — node-level metrics via kubelet API
  - apiGroups: [""]
    resources:
      - nodes/stats
      - nodes/proxy
      - nodes/metrics
    verbs: [get]
  # k8s_events receiver
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  # Token creation for API server authentication
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    verbs: [create]

---
# ── ClusterRoleBinding ─────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: otel-collector

---
# ── ConfigMap ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: config
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
        path: /healthz
      pprof:
        # Disable in production if not needed for profiling.
        endpoint: 0.0.0.0:1777

    receivers:
      # Accept OTLP from workloads on the same node.
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 4
          http:
            endpoint: 0.0.0.0:4318
            cors:
              allowed_origins: []

      # Host-level metrics (CPU, memory, disk, network, filesystem).
      hostmetrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu:
            metrics:
              system.cpu.utilization:
                enabled: true
          disk: {}
          load: {}
          filesystem:
            exclude_mount_points:
              mount_points: [/dev, /proc, /sys, /run/k3s/containerd]
              match_type: strict
            exclude_fs_types:
              fs_types: [autofs, binfmt_misc, bpf, cgroup2, configfs, debugfs,
                         devpts, devtmpfs, fusectl, hugetlbfs, iso9660, mqueue,
                         nsfs, overlay, proc, procfs, pstore, rpc_pipefs, securityfs,
                         selinuxfs, squashfs, sysfs, tracefs]
              match_type: strict
          memory:
            metrics:
              system.memory.utilization:
                enabled: true
          network:
            exclude:
              interfaces: [lo]
              match_type: strict
          paging: {}
          processes: {}

      # Kubelet-level metrics (pod CPU, memory, network, volume).
      kubeletstats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: "https://${env:NODE_IP}:10250"
        insecure_skip_verify: true
        metric_groups: [node, pod, container, volume]
        extra_metadata_labels:
          - container.id
          - k8s.volume.type

      # Kubernetes events as log records.
      k8s_events:
        namespaces: []  # empty = all namespaces

    processors:
      # Drop signals if memory exceeds limit — first line of defence against OOM.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20

      # Enrich all signals with Kubernetes workload metadata.
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.cluster.uid
          labels:
            - tag_name: app
              key: app.kubernetes.io/name
              from: pod
            - tag_name: version
              key: app.kubernetes.io/version
              from: pod
          annotations:
            - tag_name: prometheus_scrape
              key: prometheus.io/scrape
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

      # Stamp cluster name onto every resource.
      resource:
        attributes:
          - key: k8s.cluster.name
            value: ${env:CLUSTER_NAME}
            action: upsert
          - key: collector.node
            value: ${env:NODE_NAME}
            action: upsert

      # Batch before sending to reduce gRPC round trips.
      batch:
        send_batch_size: 1000
        send_batch_max_size: 2000
        timeout: 10s

    exporters:
      # Forward all signals to the OTel Gateway.
      otlp/gateway:
        endpoint: otel-gateway.otel-gateway.svc.cluster.local:4317
        tls:
          # Set insecure: false and provide ca_file for mTLS in production.
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 1000
          storage: null  # add file storage extension for persistent queue

    service:
      extensions: [health_check, pprof]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlp/gateway]
        metrics:
          receivers: [otlp, hostmetrics, kubeletstats]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlp/gateway]
        logs:
          receivers: [otlp, k8s_events]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlp/gateway]
      telemetry:
        metrics:
          level: detailed
          address: 0.0.0.0:8888
        logs:
          level: info
          encoding: json
          output_paths: [stdout]

---
# ── DaemonSet ──────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: agent
    app.kubernetes.io/version: "0.115.0"
    app.kubernetes.io/part-of: opentelemetry
  annotations:
    checksum/config: "managed-by-ci-pipeline"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/component: agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/component: agent
        app.kubernetes.io/version: "0.115.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: "/metrics"
    spec:
      # ── Identity ─────────────────────────────────────────────────────────────
      serviceAccountName: otel-collector
      automountServiceAccountToken: false

      # ── Scheduling ───────────────────────────────────────────────────────────
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/memory-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/pid-pressure
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/os: linux

      # ── Networking ───────────────────────────────────────────────────────────
      hostNetwork: false
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "3"
          - name: timeout
            value: "2"
          - name: attempts
            value: "3"

      # ── Pod-level security context ────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 30

      # ── Init containers ──────────────────────────────────────────────────────
      initContainers:
        # Validate the config before the main container starts.
        - name: config-check
          image: otel/opentelemetry-collector-contrib:0.115.0
          imagePullPolicy: IfNotPresent
          command: ["/otelcol-contrib", "validate", "--config=/conf/config.yaml"]
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true

      # ── Containers ───────────────────────────────────────────────────────────
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.115.0
          imagePullPolicy: IfNotPresent
          command: ["/otelcol-contrib", "--config=/conf/config.yaml"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: otel-collector-config
                  key: cluster_name
                  optional: true

          # ── Ports ────────────────────────────────────────────────────────────
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
              # Bind to the host port so local workloads can reach us without
              # a service: OTEL_EXPORTER_OTLP_ENDPOINT=http://$(NODE_IP):4317
              hostPort: 4317
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
              hostPort: 4318
            - name: metrics
              containerPort: 8888
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP

          # ── Security context ─────────────────────────────────────────────────
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
              # No capabilities required — OTel Collector is a pure data pipeline.

          # ── Probes ───────────────────────────────────────────────────────────
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 12
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3

          # ── Lifecycle ────────────────────────────────────────────────────────
          lifecycle:
            preStop:
              exec:
                # Drain the sending queue before SIGTERM.
                command: ["/bin/sh", "-c", "sleep 5"]

          # ── Resources ────────────────────────────────────────────────────────
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: FallbackToLogsOnError

          # ── Volume mounts ────────────────────────────────────────────────────
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
              mountPropagation: HostToContainer
            - name: tmp
              mountPath: /tmp

      # ── Volumes ──────────────────────────────────────────────────────────────
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        # Read-only view of the host filesystem for hostmetrics scraper.
        - name: hostfs
          hostPath:
            path: /
            type: Directory
        - name: tmp
          emptyDir: {}

---
# ── Service (headless for per-pod Prometheus scraping) ─────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8888"
spec:
  selector:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: agent
  clusterIP: None
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    - name: metrics
      port: 8888
      targetPort: metrics
      protocol: TCP
    - name: health
      port: 13133
      targetPort: health
      protocol: TCP

---
# ── ServiceMonitor ─────────────────────────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: monitoring
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/component: service
  namespaceSelector:
    matchNames: [otel-collector]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace

---
# ── PrometheusRule ─────────────────────────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: otel-collector
  namespace: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: alerting
    release: prometheus
spec:
  groups:
    - name: otel-collector.health
      interval: 60s
      rules:
        - alert: OtelCollectorDown
          expr: absent(up{job="otel-collector"} == 1)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "OTel Collector agent unreachable"
            description: "OTel Collector on {{ $labels.node }} has been unreachable for > 2 minutes."

        - alert: OtelCollectorDaemonSetNotFullyScheduled
          expr: |
            kube_daemonset_status_desired_number_scheduled{daemonset="otel-collector",namespace="otel-collector"}
              !=
            kube_daemonset_status_current_number_scheduled{daemonset="otel-collector",namespace="otel-collector"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OTel Collector DaemonSet not fully scheduled"
            description: "{{ $value }} nodes are missing an OTel Collector pod."

        - alert: OtelCollectorDroppedSpans
          expr: |
            rate(otelcol_processor_dropped_spans[5m]) > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OTel Collector dropping spans"
            description: "Collector on {{ $labels.node }} is dropping > 100 spans/sec. Check memory pressure or gateway connectivity."

        - alert: OtelCollectorHighMemory
          expr: |
            container_memory_working_set_bytes{
              namespace="otel-collector",
              container="otel-collector"
            } / (512 * 1024 * 1024) > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OTel Collector memory usage high"
            description: "Collector on {{ $labels.node }} is using > 85% of its memory limit."

        - alert: OtelCollectorExporterQueueFull
          expr: |
            otelcol_exporter_queue_size / otelcol_exporter_queue_capacity > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OTel Collector exporter queue filling up"
            description: "Exporter queue on {{ $labels.node }} is > 80% full. Gateway may be unreachable."

---
# ── PodDisruptionBudget ────────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otel-collector
  namespace: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: pdb
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/component: agent
  maxUnavailable: 1

---
# ── NetworkPolicy ──────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  namespace: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: netpol
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/component: agent
  policyTypes: [Ingress, Egress]
  ingress:
    # OTLP from any namespace (application workloads)
    - from:
        - namespaceSelector: {}
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
    # Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8888
          protocol: TCP
    # Health checks from any source (kubelet, load balancers)
    - ports:
        - port: 13133
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # OTel Gateway (OTLP gRPC)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel-gateway
      ports:
        - port: 4317
          protocol: TCP
    # Kubernetes API server (for k8sattributes and kubeletstats)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
        # Kubelet API on each node
        - port: 10250
          protocol: TCP
