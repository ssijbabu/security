apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubearmor
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: security-stack
spec:
  # ── Chart source ─────────────────────────────────────────────────────────────
  chart:
    spec:
      chart: kubearmor
      version: "1.7.3"
      sourceRef:
        kind: HelmRepository
        name: kubearmor
        namespace: flux-system
      interval: 12h

  interval: 1h
  releaseName: kubearmor
  targetNamespace: kubearmor
  storageNamespace: kubearmor
  maxHistory: 5
  # KubeArmor DaemonSet pods load LSM hooks at startup — allow extra time.
  timeout: 10m

  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true

  rollback:
    timeout: 10m
    cleanupOnFail: true
    recreate: false

  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/status"]
        target:
          group: apps
          kind: DaemonSet
      - paths: ["/status"]
        target:
          group: apps
          kind: Deployment

  # ── Values ───────────────────────────────────────────────────────────────────
  valuesFrom:
    - kind: ConfigMap
      name: kubearmor-values
      valuesKey: values.yaml
