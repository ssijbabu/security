apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubearmor
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
    app.kubernetes.io/part-of: security-stack
spec:
  serviceAccountName: helm-controller
  # ── Chart source ─────────────────────────────────────────────────────────────
  chart:
    spec:
      chart: kubearmor
      version: "v1.7.3"
      sourceRef:
        kind: HelmRepository
        name: management-helm-repo
        namespace: flux-system
      interval: 12h

  interval: 1h
  releaseName: kubearmor
  targetNamespace: kube-system
  storageNamespace: kube-system
  maxHistory: 5
  # KubeArmor DaemonSet pods load LSM hooks at startup — allow extra time.
  timeout: 10m

  install:
    createNamespace: false
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true

  rollback:
    timeout: 10m
    cleanupOnFail: true
    recreate: false

  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/status"]
        target:
          group: apps
          kind: DaemonSet
      - paths: ["/status"]
        target:
          group: apps
          kind: Deployment

  # ── Post-render patch ────────────────────────────────────────────────────────
  # The chart hardcodes runAsNonRoot: true on the kubearmor-controller pod but
  # the v1.7.3 image runs as root. Kubernetes rejects the pod with
  # CreateContainerConfigError. This patch removes the constraint so the
  # controller can start. Remove once the upstream image sets a non-root USER.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: kubearmor-controller
            patch: |
              - op: remove
                path: /spec/template/spec/securityContext/runAsNonRoot

  # ── Values ───────────────────────────────────────────────────────────────────
  valuesFrom:
    - kind: ConfigMap
      name: kubearmor-values
      valuesKey: values.yaml
