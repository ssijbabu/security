apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-values
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: security-stack
data:
  values.yaml: |
    # ══════════════════════════════════════════════════════════════════════════════
    # IMAGES
    # ══════════════════════════════════════════════════════════════════════════════
    image: "registry.example.com/elasticsearch/elasticsearch"
    imageTag: "8.5.1"
    imagePullPolicy: IfNotPresent

    # ══════════════════════════════════════════════════════════════════════════════
    # CONFIGURATION
    # ══════════════════════════════════════════════════════════════════════════════

    # clusterName + nodeGroup determine the Service name: sirt-master
    # Kibana's elasticsearchHosts must match this.
    clusterName: "sirt"
    nodeGroup: "master"

    # 2 replicas, quorum of 1.
    # maxUnavailable: 1 below means Kubernetes can evict 1 pod at a time,
    # leaving 1 running — exactly meeting minimumMasterNodes.
    replicas: 2
    minimumMasterNodes: 1

    # Disable the credentials Secret entirely. When secret.enabled is true (the
    # chart default) it generates a random password AND injects
    # xpack.security.enabled=true as a StatefulSet env var, which overrides
    # everything in elasticsearch.yml.
    secret:
      enabled: false

    # Tell the chart to use plain HTTP — prevents it from wiring up TLS
    # listeners or generating self-signed certificates.
    protocol: http
    createCert: false

    esConfig:
      elasticsearch.yml: |
        xpack.monitoring.collection.enabled: false
        ingest.geoip.downloader.enabled: false

    # Belt-and-suspenders: extraEnvs are appended after chart-generated env
    # vars, so these explicitly win even if the chart re-adds them.
    extraEnvs:
      - name: xpack.security.enabled
        value: "false"
      - name: xpack.security.enrollment.enabled
        value: "false"

    # kube-system has hundreds of Services. With enableServiceLinks: true
    # (chart default) each one is injected as env vars into every pod, which
    # slows startup and can exhaust the env var limit.
    enableServiceLinks: false

    # Heap: set -Xms = -Xmx and keep ≤ 50% of the container memory limit
    # so the OS page cache has room to work.
    esJavaOpts: "-Xms1g -Xmx1g"

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 2Gi

    persistence:
      enabled: true

    volumeClaimTemplate:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 30Gi

    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop: [ALL]
      allowPrivilegeEscalation: false

    # Azure Policy blocks privileged containers — disable the chart's sysctl
    # init container. Set vm.max_map_count=262144 at the node pool level via
    # AKS LinuxOSConfig instead (see note in helmrelease.yaml).
    sysctlInitContainer:
      enabled: false

    # soft: schedule on separate nodes when possible, but don't block if there
    # aren't enough. Use hard (chart default) only if you have ≥3 dedicated nodes.
    antiAffinity: "soft"

    # maxUnavailable controls the PodDisruptionBudget — this is the correct
    # chart key (podDisruptionBudget.enabled is not a valid chart value).
    maxUnavailable: 1

    service:
      type: ClusterIP
