apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: elasticsearch
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
    app.kubernetes.io/part-of: security-stack
spec:
  serviceAccountName: helm-controller
  chart:
    spec:
      chart: elasticsearch
      version: "8.5.1"
      sourceRef:
        kind: HelmRepository
        name: management-helm-repo
        namespace: flux-system
      interval: 15m

  interval: 15m
  releaseName: elasticsearch
  targetNamespace: kube-system
  storageNamespace: kube-system
  maxHistory: 5
  timeout: 10m

  install:
    createNamespace: false
    crds: Skip
    remediation:
      retries: 3

  upgrade:
    crds: Skip
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true

  rollback:
    timeout: 10m
    cleanupOnFail: true
    recreate: false

  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/status"]
        target:
          group: apps
          kind: StatefulSet

  # ── Node prerequisite ────────────────────────────────────────────────────────
  # Elasticsearch requires vm.max_map_count ≥ 262144 on every node it can land
  # on. The chart's sysctlInitContainer is disabled because Azure Policy blocks
  # privileged containers. Configure it at the AKS node pool level instead:
  #
  #   az aks nodepool update \
  #     --resource-group <rg> --cluster-name <cluster> --name <nodepool> \
  #     --node-osdisk-type Managed \  # only if not already set
  #     --aks-custom-headers LinuxOSConfig='{"sysctls":{"vmMaxMapCount":262144}}'
  #
  # For Terraform:
  #   linux_os_config { sysctl_config { vm_max_map_count = 262144 } }
  #
  # For Bicep:
  #   linuxOSConfig: { sysctls: { vmMaxMapCount: 262144 } }
  #
  # LinuxOSConfig can only be set at nodepool creation time on most AKS
  # versions. If the nodepool already exists, recreate it or use a dedicated
  # nodepool for Elasticsearch with the sysctl pre-configured.
  # ─────────────────────────────────────────────────────────────────────────────

  # ── Post-render patch ────────────────────────────────────────────────────────
  # The chart hardcodes a complex cluster-health readiness script in the
  # StatefulSet template. Values only control the timing params, not the
  # command. Replace the entire probe via strategic merge patch.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: sirt-master
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: sirt-master
              spec:
                template:
                  spec:
                    containers:
                      - name: elasticsearch
                        readinessProbe:
                          exec:
                            command:
                              - bash
                              - -c
                              - |
                                curl -sf http://127.0.0.1:9200 >/dev/null
                          initialDelaySeconds: 10
                          periodSeconds: 10
                          timeoutSeconds: 5
                          failureThreshold: 3
                          successThreshold: 3

  valuesFrom:
    - kind: ConfigMap
      name: elasticsearch-values
      valuesKey: values.yaml
