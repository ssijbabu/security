apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: elasticsearch
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
    app.kubernetes.io/part-of: security-stack
spec:
  serviceAccountName: helm-controller
  chart:
    spec:
      chart: elasticsearch
      version: "8.5.1"
      sourceRef:
        kind: HelmRepository
        name: management-helm-repo
        namespace: flux-system
      interval: 15m

  interval: 15m
  releaseName: elasticsearch
  targetNamespace: elastic
  storageNamespace: elastic
  maxHistory: 5
  timeout: 10m

  install:
    createNamespace: true
    crds: Skip
    remediation:
      retries: 3

  upgrade:
    crds: Skip
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true

  rollback:
    timeout: 10m
    cleanupOnFail: true
    recreate: false

  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/status"]
        target:
          group: apps
          kind: StatefulSet

  valuesFrom:
    - kind: ConfigMap
      name: elasticsearch-values
      valuesKey: values.yaml
