{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "tetragon.fullname" . }}
  namespace: {{ include "tetragon.namespace" . }}
  labels:
    {{- include "tetragon.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: {{ include "tetragon.fullname" . }}.health
      interval: 60s
      rules:
        - alert: TetragonAgentDown
          expr: |
            absent(up{job="{{ include "tetragon.fullname" . }}"} == 1)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Tetragon agent unreachable"
            description: >-
              Tetragon metrics endpoint has been unreachable for > 2 minutes
              on {{ "{{" }} $labels.node {{ "}}" }}.

        - alert: TetragonDaemonSetNotFullyScheduled
          expr: |
            kube_daemonset_status_desired_number_scheduled{
              daemonset="{{ include "tetragon.fullname" . }}",
              namespace="{{ include "tetragon.namespace" . }}"
            }
            !=
            kube_daemonset_status_current_number_scheduled{
              daemonset="{{ include "tetragon.fullname" . }}",
              namespace="{{ include "tetragon.namespace" . }}"
            }
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Tetragon DaemonSet not fully scheduled"
            description: >-
              {{ "{{" }} $value {{ "}}" }} nodes are missing a Tetragon pod.

        - alert: TetragonHighDropRate
          expr: |
            rate(tetragon_events_exported_total{result="dropped"}[5m]) > 100
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Tetragon event drop rate elevated"
            description: >-
              Tetragon is dropping > 100 events/sec on {{ "{{" }} $labels.node {{ "}}" }}.
              Consider increasing buffer size.

      {{- with .Values.prometheusRule.additionalRules }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
