apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "tetragon.fullname" . }}
  namespace: {{ include "tetragon.namespace" . }}
  labels:
    {{- include "tetragon.labels" . | nindent 4 }}
  annotations:
    # Trigger a rollout when the ConfigMap content changes.
    checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "tetragon.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "tetragon.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Re-roll pods automatically when config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # ── Identity ─────────────────────────────────────────────────────────────
      serviceAccountName: {{ include "tetragon.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}

      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # ── Scheduling ───────────────────────────────────────────────────────────
      priorityClassName: {{ .Values.priorityClassName }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # ── Networking ───────────────────────────────────────────────────────────
      hostPID: true
      hostNetwork: false
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "3"
          - name: timeout
            value: "2"
          - name: attempts
            value: "3"

      # ── Pod-level security context ────────────────────────────────────────────
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}

      # ── Init containers ──────────────────────────────────────────────────────
      initContainers:
        - name: mount-bpf-fs
          image: {{ include "tetragon.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              mountpoint -q /sys/fs/bpf || mount -t bpf bpf /sys/fs/bpf -o rw,nosuid,nodev,noexec,relatime
          securityContext:
            {{- toYaml .Values.initSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          volumeMounts:
            - name: bpf-maps
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional

      # ── Containers ───────────────────────────────────────────────────────────
      containers:
        - name: tetragon
          image: {{ include "tetragon.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config-dir=/etc/tetragon/tetragon.conf.d/
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          ports:
            - name: metrics
              containerPort: {{ .Values.service.ports.metrics }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.ports.grpc }}
              protocol: TCP

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}

          lifecycle:
            preStop:
              exec:
                command: ["/bin/bash", "-c", "sleep 5"]

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: FallbackToLogsOnError

          volumeMounts:
            - name: bpf-maps
              mountPath: /sys/fs/bpf
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: tetragon-run
              mountPath: /var/run/cilium/tetragon
            - name: tetragon-config
              mountPath: /etc/tetragon/tetragon.conf.d/
              readOnly: true
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: tmp
              mountPath: /tmp

      # ── Volumes ──────────────────────────────────────────────────────────────
      volumes:
        - name: bpf-maps
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: DirectoryOrCreate
        - name: tetragon-run
          hostPath:
            path: /var/run/cilium/tetragon
            type: DirectoryOrCreate
        - name: tetragon-config
          configMap:
            name: {{ include "tetragon.fullname" . }}-config
        - name: proc
          hostPath:
            path: /proc
        - name: tmp
          emptyDir: {}
