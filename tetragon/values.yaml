# Production values override for the official Tetragon Helm chart.
#
# Target chart : cilium/tetragon v1.7.0
# Chart source : https://helm.cilium.io/
#
# Install:
#   helm repo add cilium https://helm.cilium.io/
#   helm upgrade --install tetragon cilium/tetragon \
#     --version 1.7.0 \
#     --namespace tetragon --create-namespace \
#     --values tetragon/values.yaml
#
# Non-root enforcement:
#   All containers run as UID ≥ 65532 with runAsNonRoot: true.
#   The agent uses explicit Linux capabilities instead of privileged: true.

# ── Scheduling ─────────────────────────────────────────────────────────────────
priorityClassName: system-node-critical

imagePullPolicy: IfNotPresent

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - operator: Exists
    effect: NoSchedule
  - operator: Exists
    effect: NoExecute
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
  - key: node.kubernetes.io/disk-pressure
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/memory-pressure
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/pid-pressure
    operator: Exists
    effect: NoSchedule

# ── DaemonSet update strategy ──────────────────────────────────────────────────
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# ── Pod-level security context ─────────────────────────────────────────────────
# Applies to the tetragon agent, the export sidecar, and the init containers.
# UID 65534 = nobody.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    # RuntimeDefault may block bpf(2) on Docker <= 20.
    # Switch to Unconfined and document the exception if bpf() is blocked.
    type: RuntimeDefault

# ── Tetragon agent ─────────────────────────────────────────────────────────────
tetragon:
  image:
    # Pin to a digest in production:
    #   crane digest quay.io/cilium/tetragon:v1.7.0
    repository: quay.io/cilium/tetragon
    tag: v1.7.0

  # Replace privileged: true with a minimal capability set.
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop: [ALL]
      add:
        - BPF           # load/pin/manage eBPF programs and maps
        - PERFMON       # attach perf_event sources used by eBPF
        - SYS_RESOURCE  # raise RLIMIT_MEMLOCK for BPF map memory
        - NET_ADMIN     # attach TC/XDP eBPF programs
        - SYS_PTRACE    # read /proc/<pid>/status for credential enrichment
        - DAC_READ_SEARCH  # read /proc entries owned by other UIDs when non-root

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # ── Process visibility ───────────────────────────────────────────────────────
  enableProcessCred: true
  enableProcessNs: true
  enableK8sAPI: true
  enablePolicyFilter: true

  # ── Export / log rotation ────────────────────────────────────────────────────
  exportFilePerm: "600"
  exportFileMaxSizeMB: 100
  exportFileMaxBackups: 5
  exportFileCompress: true
  # Redact common secret patterns from process args.
  redactionFilters: |
    {"redact": ["--password(?:\\s+|=)(\\S*)", "-p(?:\\s+|=)(\\S*)", "(?i)token[=:](\\S*)"]}
  # Drop health-check and system namespace noise from exports.
  exportDenyList: |
    {"health_check":true}
    {"namespace":["", "cilium", "kube-system"]}

  # ── Cluster identity ─────────────────────────────────────────────────────────
  # Set to your cluster name so events carry k8s.cluster.name.
  clusterName: ""

  # ── Metrics ──────────────────────────────────────────────────────────────────
  prometheus:
    enabled: true
    address: ""
    port: 2112
    metricsLabelFilter: "namespace,workload,pod,binary"
    serviceMonitor:
      enabled: true
      scrapeInterval: 30s
      # Must match your Prometheus CR's serviceMonitorSelector.
      extraLabels:
        release: prometheus

  # ── gRPC ─────────────────────────────────────────────────────────────────────
  grpc:
    enabled: true
    address: "localhost:54321"

  # ── Health ───────────────────────────────────────────────────────────────────
  healthGrpc:
    enabled: true
    port: 6789
    interval: 10

# ── Tetragon Operator ──────────────────────────────────────────────────────────
tetragonOperator:
  enabled: true
  replicas: 1
  priorityClassName: system-cluster-critical

  image:
    repository: quay.io/cilium/tetragon-operator
    tag: v1.7.0
    pullPolicy: IfNotPresent

  # The upstream default already sets runAsUser: 65532 / runAsNonRoot: true.
  # Harden further with seccompProfile and readOnlyRootFilesystem.
  containerSecurityContext:
    runAsUser: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop: [ALL]

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  prometheus:
    enabled: true
    port: 2113
    serviceMonitor:
      enabled: true
      scrapeInterval: 30s
      extraLabels:
        release: prometheus

  tracingPolicy:
    enabled: true

# ── Export sidecar ─────────────────────────────────────────────────────────────
export:
  mode: "stdout"
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ── CRDs ───────────────────────────────────────────────────────────────────────
crds:
  # "operator" lets the Tetragon Operator manage CRD lifecycle.
  # Switch to "helm" if you need CRDs in the Helm diff/rollback cycle.
  installMethod: "operator"
