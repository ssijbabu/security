apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: security-stack
spec:
  # Poll the upstream index every 12 h — avoids hammering the registry while
  # still picking up new chart versions within half a day.
  interval: 12h
  url: https://helm.cilium.io/
