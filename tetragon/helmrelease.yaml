apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tetragon
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: security-stack
spec:
  # ── Chart source ─────────────────────────────────────────────────────────────
  chart:
    spec:
      chart: tetragon
      # Pin to an exact version. Bump this field to trigger an upgrade.
      version: "1.7.0"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      # How often to check whether a new chart version matching the constraint
      # is available. Irrelevant for exact-version pins but required by the spec.
      interval: 12h

  # How often the helm-controller reconciles this release (idempotent apply).
  interval: 1h

  # Deploy into the tetragon namespace; create it if it does not exist.
  releaseName: tetragon
  targetNamespace: tetragon
  storageNamespace: tetragon

  # Keep the last 5 Helm release secrets for rollback.
  maxHistory: 5

  # Allow enough time for eBPF program loading on DaemonSet pods (can be
  # slow on first install on nodes with cold BPF caches).
  timeout: 10m

  # ── CRD policy ───────────────────────────────────────────────────────────────
  install:
    createNamespace: true
    # CreateReplace keeps TracingPolicy / PodInfo CRDs in sync on upgrade.
    # Switch to Skip if you manage CRDs separately (e.g. via a dedicated
    # Kustomization that runs before this release).
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
      # Roll back to the last-known-good release after the final failed retry.
      remediateLastFailure: true

  rollback:
    timeout: 10m
    cleanupOnFail: true
    recreate: false

  # ── Drift detection ───────────────────────────────────────────────────────────
  # Detect and correct out-of-band changes to cluster resources.
  driftDetection:
    mode: enabled
    ignore:
      # status subresources are managed by controllers, not Helm.
      - paths: ["/status"]
        target:
          group: apps
          kind: DaemonSet
      - paths: ["/status"]
        target:
          group: apps
          kind: Deployment

  # ── Values ───────────────────────────────────────────────────────────────────
  valuesFrom:
    - kind: ConfigMap
      name: tetragon-values
      valuesKey: values.yaml
