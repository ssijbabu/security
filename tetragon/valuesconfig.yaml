apiVersion: v1
kind: ConfigMap
metadata:
  name: tetragon-values
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: security-stack
data:
  values.yaml: |
    # ══════════════════════════════════════════════════════════════════════════════
    # IMAGES — update repository prefixes to match your private registry.
    # All three images must be mirrored before deploying.
    # ══════════════════════════════════════════════════════════════════════════════
    imagePullPolicy: IfNotPresent

    imagePullSecrets:
      - name: private-registry-credentials

    tetragon:
      image:
        repository: registry.example.com/cilium/tetragon
        tag: v1.7.0

    tetragonOperator:
      image:
        repository: registry.example.com/cilium/tetragon-operator
        tag: v1.7.0
        pullPolicy: IfNotPresent

    export:
      stdout:
        image:
          repository: registry.example.com/cilium/hubble-export-stdout
          tag: v1.1.1

    # ══════════════════════════════════════════════════════════════════════════════
    # CONFIGURATION
    # ══════════════════════════════════════════════════════════════════════════════

    # ── Scheduling ─────────────────────────────────────────────────────────────
    priorityClassName: system-node-critical

    nodeSelector:
      kubernetes.io/os: linux

    tolerations:
      - operator: Exists
        effect: NoSchedule
      - operator: Exists
        effect: NoExecute
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
      - key: node.kubernetes.io/disk-pressure
        operator: Exists
        effect: NoSchedule
      - key: node.kubernetes.io/memory-pressure
        operator: Exists
        effect: NoSchedule
      - key: node.kubernetes.io/pid-pressure
        operator: Exists
        effect: NoSchedule

    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1

    # ── Pod-level security context ──────────────────────────────────────────────
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault

    # ── Tetragon agent ──────────────────────────────────────────────────────────
    tetragon:
      # The chart mounts /sys/fs/bpf with Bidirectional propagation, which
      # Kubernetes requires privileged: true for. Non-root is enforced at the
      # pod level via podSecurityContext.runAsUser: 65534 instead.
      # See todo: harden agent securityContext once Tetragon supports
      # non-privileged mode upstream.

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi

      enableProcessCred: true
      enableProcessNs: true
      enableK8sAPI: true
      enablePolicyFilter: true

      exportFilePerm: "600"
      exportFileMaxSizeMB: 100
      exportFileMaxBackups: 5
      exportFileCompress: true

      redactionFilters: |
        {"redact": ["--password(?:\\s+|=)(\\S*)", "-p(?:\\s+|=)(\\S*)", "(?i)token[=:](\\S*)"]}

      exportDenyList: |
        {"health_check":true}
        {"namespace":["", "cilium", "kube-system"]}

      clusterName: ""

      prometheus:
        enabled: true
        address: ""
        port: 2112
        metricsLabelFilter: "namespace,workload,pod,binary"
        serviceMonitor:
          enabled: false

      grpc:
        enabled: true
        address: "localhost:54321"

      healthGrpc:
        enabled: true
        port: 6789
        interval: 10

    # ── Tetragon Operator ───────────────────────────────────────────────────────
    tetragonOperator:
      enabled: true
      replicas: 1
      priorityClassName: system-cluster-critical

      containerSecurityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop: [ALL]

      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi

      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0

      prometheus:
        enabled: true
        port: 2113
        serviceMonitor:
          enabled: false

      tracingPolicy:
        enabled: true

    # ── Export sidecar ──────────────────────────────────────────────────────────
    export:
      mode: "stdout"
      # securityContext not overridden — export sidecar also mounts with
      # Bidirectional propagation and requires privileged: true (chart default).
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

    # ── CRDs ────────────────────────────────────────────────────────────────────
    crds:
      installMethod: "operator"
